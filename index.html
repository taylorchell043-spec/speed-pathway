<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100a"><title>Midwest Speed - Speed Pathway</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07100a;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,94vw);background:#111813;border:1px solid #273329;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0008}.logo{width:64px;height:64px;border-radius:16px;background:#35d05b;color:#07100a;display:grid;place-items:center;font-weight:900;font-size:24px;margin-bottom:18px}.ey{font-size:11px;letter-spacing:.18em;color:#35d05b;font-weight:900}.title{font-size:30px;font-weight:900;margin:5px 0 8px}.sub,.muted{color:#9cac9f}.sub{margin:0 0 20px}label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px}input{width:100%;background:#080d0a;border:1px solid #334237;color:#fff;border-radius:10px;padding:13px;font-size:16px}button{width:100%;margin-top:17px;background:#35d05b;color:#061008;border:0;border-radius:10px;padding:13px;font-weight:900;font-size:15px;cursor:pointer}.secondary{background:#0a100c;color:#fff;border:1px solid #334237}.linkbtn{background:transparent;color:#35d05b;border:0;padding:8px;margin-top:8px}.msg{color:#b7c5ba;font-size:13px;margin-top:13px;min-height:18px}.dash,.signup{display:none}.pill{display:inline-block;background:#35d05b20;border:1px solid #35d05b55;color:#35d05b;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.pending{padding:14px;background:#19150c;border:1px solid #5d4c25;border-radius:12px;color:#ead8a4;margin:14px 0}</style></head><body><div class="card"><section id="login"><div class="logo">MS</div><div class="ey">MIDWEST SPEED</div><div class="title">Speed Pathway</div><p class="sub">Sign in to the Midwest Speed recruiting platform.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button id="go">Sign In</button><button id="showSignup" class="secondary">Create Account</button><div id="msg" class="msg"></div></section><section id="signup" class="signup"><div class="logo">MS</div><div class="ey">MIDWEST SPEED</div><div class="title">Create Account</div><p class="sub">Bosses, coaches, athletes and parents can register here. Midwest Speed will approve access after registration.</p><label>Full Name</label><input id="name" type="text" autocomplete="name"><label>Email</label><input id="newEmail" type="email" autocomplete="email"><label>Password</label><input id="newPw" type="password" autocomplete="new-password"><button id="create">Create Account</button><button id="back" class="secondary">Back to Sign In</button><div id="signupMsg" class="msg"></div></section><section id="dash" class="dash"><div class="logo">MS</div><div class="ey">MIDWEST SPEED</div><div class="title">Speed Pathway</div><div id="content"></div><button id="out" class="secondary">Sign Out</button></section></div><script>const sb=supabase.createClient('https://rcisvivlhpdwwikoakmt.supabase.co','sb_publishable_WF7qqXdDuSld2wu1PQYJbQ_3h5avNvz');const $=x=>document.getElementById(x);function show(id){['login','signup','dash'].forEach(x=>$(x).style.display=x===id?'block':'none')}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){show('login');return}show('dash');const {data:p,error}=await sb.from('profiles').select('display_name,role,approved').eq('id',session.user.id).single();if(error){$('content').innerHTML='<div class="pending">Signed in, but profile load failed: '+error.message+'</div>';return}if(!p.approved){$('content').innerHTML='<div class="pending">Account created successfully. Your access is pending Midwest Speed administrator approval.</div>';return}$('content').innerHTML='<p><span class="pill">'+String(p.role||'user').replaceAll('_',' ').toUpperCase()+'</span></p><h2>Welcome'+(p.display_name?', '+p.display_name:'')+'</h2><p class="muted">Your account is approved and connected to the live Midwest Speed database.</p>'}$('go').onclick=async()=>{$('msg').textContent='Signing in...';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});if(error){$('msg').textContent=error.message;return}$('msg').textContent='';await boot()};$('showSignup').onclick=()=>show('signup');$('back').onclick=()=>show('login');$('create').onclick=async()=>{const name=$('name').value.trim(),email=$('newEmail').value.trim(),password=$('newPw').value;if(!name||!email||password.length<6){$('signupMsg').textContent='Enter your full name, email, and a password with at least 6 characters.';return}$('signupMsg').textContent='Creating account...';const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:'https://taylorchell043-spec.github.io/speed-pathway/'}});if(error){$('signupMsg').textContent=error.message;return}if(data.session){$('signupMsg').textContent='Account created. Loading...';setTimeout(boot,400)}else{$('signupMsg').textContent='Account created. Check your email for the confirmation link, then return here to sign in.'}};$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};boot();</script></body></html>
