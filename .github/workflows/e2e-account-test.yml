name: E2E Account Workflow Verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/e2e-account-test.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Run production account E2E
        run: node e2e-account-test.mjs
