name: Deploy Speed Pathway to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Speed Pathway
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          cp pathway-upgrade.js pathway-upgrade.css recruiting-playbook.js _site/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          cache='<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">'
          css='<link rel="stylesheet" href="pathway-upgrade.css?v=24">'
          scripts=['<script src="pathway-upgrade.js?v=24"></script>','<script src="recruiting-playbook.js?v=24"></script>']
          if cache not in s:
              s=s.replace('</head>',cache+'\n'+css+'\n</head>')
          else:
              if css not in s:s=s.replace('</head>',css+'\n</head>')
          for js in scripts:
              if js not in s:s=s.replace('</body>',js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
