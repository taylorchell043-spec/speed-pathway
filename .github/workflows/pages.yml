name: Deploy Speed Pathway to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Speed Pathway
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          # Ship every local runtime asset referenced by the app.
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.svg' -o -name '*.png' -o -name '*.webp' -o -name '*.jpg' \) -exec cp {} _site/ \;
          # index.html already declares versioned scripts and styles.
          # Do not inject duplicate scripts or stale ?v=25 assets.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
