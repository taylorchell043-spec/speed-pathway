name: Speed Pathway Auth E2E Probe
on:
  push:
    paths:
      - '.github/workflows/e2e-auth-probe.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify signup token and follow redirect
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='f663d2331c613e85315b822acda8503d5827a68a0b67cd6a058c83d8'
          KEY='sb_publishable_WF7qqXdDuSld2wu1PQYJbQ_3h5avNvz'
          URL="https://rcisvivlhpdwwikoakmt.supabase.co/auth/v1/verify?token=$TOKEN&type=signup&redirect_to=https%3A%2F%2Ftaylorchell043-spec.github.io%2Fspeed-pathway%2F"
          curl -sS -L -o /tmp/verify-body -D /tmp/verify-headers -w 'verify_http=%{http_code}\nverify_final_url=%{url_effective}\n' -H "apikey: $KEY" "$URL"
          echo 'redirect_chain:'
          grep -iE '^(HTTP/|location:)' /tmp/verify-headers || true
