name: Speed Pathway Current Auth E2E
on:
  push:
    branches: [main]
    paths: ['.github/workflows/e2e-current-auth.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Run live account workflow
        run: |
          cat > /tmp/e2e.mjs <<'NODE'
          import { chromium } from 'playwright';
          import crypto from 'crypto';
          const SITE='https://taylorchell043-spec.github.io/speed-pathway/';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const run=process.env.GITHUB_RUN_ID;
          const SUPA='https://rcisvivlhpdwwikoakmt.supabase.co';
          const KEY='sb_publishable_WF7qqXdDuSld2wu1PQYJbQ_3h5avNvz';
          const H={'apikey':KEY,'content-type':'application/json'};
          const log=x=>console.log('[E2E] '+x);
          async function mailbox(label){
            const domains=await (await fetch('https://api.mail.tm/domains?page=1')).json();
            const domain=domains['hydra:member'][0].domain;
            const address=`speedpathway-${label}-${run}-${crypto.randomBytes(3).toString('hex')}@${domain}`;
            const password='Spd!'+crypto.randomBytes(15).toString('base64url');
            let r=await fetch('https://api.mail.tm/accounts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address,password})}); if(!r.ok)throw new Error('mailbox '+r.status+' '+await r.text());
            r=await fetch('https://api.mail.tm/token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address,password})}); if(!r.ok)throw new Error('mail token '+r.status);
            return {address,password,token:(await r.json()).token};
          }
          async function confirmation(box){
            const end=Date.now()+150000;
            while(Date.now()<end){
              const r=await fetch('https://api.mail.tm/messages?page=1',{headers:{authorization:'Bearer '+box.token}});
              if(r.ok){for(const m of (await r.json())['hydra:member']||[]){const rr=await fetch('https://api.mail.tm/messages/'+m.id,{headers:{authorization:'Bearer '+box.token}});if(!rr.ok)continue;const j=await rr.json();const h=Array.isArray(j.html)?j.html.join(' '):(j.html||'');const body=(j.text||'')+' '+h;const links=body.replaceAll('&amp;','&').match(/https?:\/\/[^\s"'<>]+/g)||[];const link=links.find(u=>u.includes('/auth/v1/verify'));if(link)return link.replace(/[)>.,]+$/,'');}}
              await sleep(3000);
            } throw new Error('confirmation email not received');
          }
          async function create(page,box,name,kind){
            await page.goto(SITE,{waitUntil:'networkidle'}); await page.click('#authShowSignup'); await page.fill('#authName',name); await page.fill('#authNewEmail',box.address); await page.fill('#authNewPassword',box.password); await page.click('#authCreate');
            await page.waitForFunction(()=>document.querySelector('#authSignupMsg')?.textContent?.toLowerCase().includes('account created'),null,{timeout:30000}); log(kind+'_ACCOUNT_CREATED '+box.address);
            const link=await confirmation(box); log(kind+'_CONFIRMATION_RECEIVED');
            await page.goto(link,{waitUntil:'networkidle'}); await sleep(1500); const u=page.url(); const body=(await page.locator('body').innerText()).toLowerCase();
            if(!u.startsWith(SITE)||body.includes('localhost')||body.includes('error exchanging code'))throw new Error('bad confirmation redirect '+u); log(kind+'_CONFIRMATION_REDIRECT_OK '+u);
          }
          async function signOut(page){
            if(await page.locator('#accountOut').isVisible().catch(()=>false)){await page.click('#accountOut');await page.waitForLoadState('networkidle');return}
            if(await page.locator('#pendingOut').isVisible().catch(()=>false)){await page.click('#pendingOut');await page.waitForLoadState('networkidle');return}
            await page.context().clearCookies(); await page.goto(SITE,{waitUntil:'networkidle'});
          }
          async function signIn(page,box){await page.goto(SITE,{waitUntil:'networkidle'});if(!(await page.locator('#loginPanel').isVisible().catch(()=>false)))await signOut(page);await page.fill('#authEmail',box.address);await page.fill('#authPassword',box.password);await page.click('#authLogin');await sleep(1800);const e=await page.locator('#authMsg').textContent().catch(()=>null);if(e?.toLowerCase().includes('invalid'))throw new Error('signin failed '+e)}
          const browser=await chromium.launch({headless:true}); const ctx=await browser.newContext(); const page=await ctx.newPage();
          try{
            const admin=await mailbox('admin'); await create(page,admin,'Speed Pathway E2E Admin','ADMIN'); await signIn(page,admin); if(!(await page.locator('#pendingPanel').isVisible().catch(()=>false)))throw new Error('fresh admin candidate not pending'); log('ADMIN_PENDING_OK '+admin.address);
            const lr=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:H,body:JSON.stringify({email:admin.address,password:admin.password})});if(!lr.ok)throw new Error('admin token failed');const uid=(await lr.json()).user.id;log('ADMIN_CANDIDATE_ID '+uid); log('WAITING_FOR_EXTERNAL_ADMIN_PROMOTION');
            let ready=false;for(let i=0;i<100;i++){await page.reload({waitUntil:'networkidle'});await sleep(1500);if(await page.locator('#appRoot').isVisible().catch(()=>false)){await page.click('button[data-page="admin"]');if(await page.locator('#accountAdminCard').isVisible().catch(()=>false)){ready=true;break}}await sleep(2500)}if(!ready)throw new Error('admin candidate never promoted'); log('ADMIN_UI_READY');
            await signOut(page); await sleep(70000);
            const user=await mailbox('user'); await create(page,user,'Speed Pathway E2E Pending User','USER'); await signIn(page,user); if(!(await page.locator('#pendingPanel').isVisible().catch(()=>false)))throw new Error('new user not pending'); log('USER_PENDING_GATE_OK');
            await signOut(page); await signIn(page,admin); await page.click('button[data-page="admin"]'); await page.waitForSelector('#accountAdminCard',{timeout:15000}); await page.click('#acctRefresh'); await sleep(1000);
            const row=page.locator('#acctList tbody tr',{hasText:user.address}); if(await row.count()!==1)throw new Error('pending registration absent from Program Admin'); const status=await row.locator('td').nth(2).innerText(); if(!status.includes('Pending'))throw new Error('row is not pending'); log('PENDING_VISIBLE_IN_PROGRAM_ADMIN');
            await row.locator('select[data-role]').selectOption('coach'); await row.locator('button[data-save]').click(); await sleep(1800); const active=page.locator('#acctList tbody tr',{hasText:user.address}); if(await active.count()!==1)throw new Error('approved row disappeared'); if((await active.locator('select[data-role]').inputValue())!=='coach')throw new Error('coach role not persisted'); if(!(await active.locator('td').nth(2).innerText()).includes('Approved'))throw new Error('approval not persisted'); log('ADMIN_APPROVAL_ROLE_OK');
            await signOut(page); await signIn(page,user); if(!(await page.locator('#appRoot').isVisible().catch(()=>false)))throw new Error('approved user cannot enter app'); if(await page.locator('#pendingPanel').isVisible().catch(()=>false))throw new Error('approved user still pending'); const who=(await page.locator('#accountWho').innerText()).toUpperCase(); if(!who.includes('COACH'))throw new Error('role not reflected '+who); log('APPROVED_USER_SIGNIN_OK'); log('E2E_SUCCESS');
          } finally {await browser.close()}
          NODE
          node /tmp/e2e.mjs
