name: Speed Pathway Auth E2E Test
on:
  push:
    paths:
      - '.github/workflows/e2e-auth-test.yml'
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm first account and create confirmed pending user
        env:
          SUPA_URL: https://rcisvivlhpdwwikoakmt.supabase.co
          SUPA_KEY: sb_publishable_WF7qqXdDuSld2wu1PQYJbQ_3h5avNvz
          REDIRECT: https://taylorchell043-spec.github.io/speed-pathway/
          TEST_PASSWORD: SpdE2E-Confirm-2026!
          ADMIN_CANDIDATE_EMAIL: speedpathway-user-31925500884@emalupe.com
        run: |
          python3 - <<'PY'
          import os,time,re,html,requests
          S=os.environ['SUPA_URL']; K=os.environ['SUPA_KEY']; R=os.environ['REDIRECT']; P=os.environ['TEST_PASSWORD']
          H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'}
          def mt_token(email):
              r=requests.post('https://api.mail.tm/token',json={'address':email,'password':P},timeout=20); r.raise_for_status(); return r.json()['token']
          def confirm(email,kind):
              tok=mt_token(email); mh={'Authorization':'Bearer '+tok}
              link=None
              for _ in range(30):
                  msgs=requests.get('https://api.mail.tm/messages',headers=mh,timeout=15).json().get('hydra:member',[])
                  if msgs:
                      m=requests.get('https://api.mail.tm/messages/'+msgs[0]['id'],headers=mh,timeout=15).json()
                      blob=((m.get('html') or [''])[0] if isinstance(m.get('html'),list) else (m.get('html') or ''))+' '+(m.get('text') or '')
                      blob=html.unescape(blob)
                      for u in re.findall(r'https?://[^\s"<>]+',blob):
                          if '/auth/v1/verify' in u: link=u.replace('&amp;','&'); break
                  if link: break
                  time.sleep(2)
              assert link, 'confirmation link not found'
              rr=requests.get(link,allow_redirects=True,timeout=30)
              print(kind+'_confirm_final='+rr.url); print(kind+'_confirm_http='+str(rr.status_code))
              assert rr.url.startswith(R), rr.url
              assert rr.status_code==200
              lr=requests.post(S+'/auth/v1/token?grant_type=password',headers=H,json={'email':email,'password':P},timeout=25)
              print(kind+'_login_http='+str(lr.status_code)); lr.raise_for_status(); return lr.json()
          admin_email=os.environ['ADMIN_CANDIDATE_EMAIL']
          admin_login=confirm(admin_email,'admin_candidate')
          aid=admin_login['user']['id']
          # Wait out Supabase signup email-rate window before creating the second account.
          time.sleep(70)
          run=os.environ['GITHUB_RUN_ID']
          domain=requests.get('https://api.mail.tm/domains',timeout=20).json()['hydra:member'][0]['domain']
          user_email=f'speedpathway-pending-{run}@{domain}'
          r=requests.post('https://api.mail.tm/accounts',json={'address':user_email,'password':P},timeout=20); r.raise_for_status()
          sr=requests.post(S+'/auth/v1/signup',params={'redirect_to':R},headers=H,json={'email':user_email,'password':P,'data':{'display_name':f'Speed Pathway E2E pending {run}','e2e_run':run,'e2e_kind':'pending'}},timeout=25)
          print('pending_signup_http='+str(sr.status_code)); print('pending_signup_body='+sr.text[:300]); sr.raise_for_status(); uid=sr.json()['id']
          user_login=confirm(user_email,'pending_user')
          uh={'apikey':K,'Authorization':'Bearer '+user_login['access_token']}
          pr=requests.get(S+'/rest/v1/profiles',headers=uh,params={'id':'eq.'+uid,'select':'id,role,approved'},timeout=20); pr.raise_for_status()
          print('pending_profile='+str(pr.json()))
          assert pr.json() and pr.json()[0]['role']=='pending' and pr.json()[0]['approved'] is False
          print('ADMIN_CANDIDATE_ID='+aid); print('ADMIN_CANDIDATE_EMAIL='+admin_email)
          print('PENDING_USER_ID='+uid); print('PENDING_USER_EMAIL='+user_email)
          print('SETUP_OK=true')
          PY
