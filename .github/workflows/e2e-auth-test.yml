name: Speed Pathway Auth E2E Test
on:
  push:
    paths:
      - '.github/workflows/e2e-auth-test.yml'
permissions:
  contents: read
jobs:
  phase-a:
    runs-on: ubuntu-latest
    steps:
      - name: Create, confirm, and sign in a fresh admin-candidate account
        env:
          SUPA_URL: https://rcisvivlhpdwwikoakmt.supabase.co
          SUPA_KEY: sb_publishable_WF7qqXdDuSld2wu1PQYJbQ_3h5avNvz
          REDIRECT: https://taylorchell043-spec.github.io/speed-pathway/
          TEST_PASSWORD: SpdE2E-2026-Verify!
        run: |
          python3 - <<'PY'
          import os,time,re,html,requests
          S=os.environ['SUPA_URL']; K=os.environ['SUPA_KEY']; R=os.environ['REDIRECT']; P=os.environ['TEST_PASSWORD']
          H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'}
          run=os.environ['GITHUB_RUN_ID']
          domain=requests.get('https://api.mail.tm/domains',timeout=20).json()['hydra:member'][0]['domain']
          email=f'speedpathway-admin-{run}@{domain}'
          a=requests.post('https://api.mail.tm/accounts',json={'address':email,'password':P},timeout=20); a.raise_for_status()
          tok=requests.post('https://api.mail.tm/token',json={'address':email,'password':P},timeout=20).json()['token']
          mh={'Authorization':'Bearer '+tok}
          sr=requests.post(S+'/auth/v1/signup',params={'redirect_to':R},headers=H,json={'email':email,'password':P,'data':{'display_name':'Speed Pathway E2E Admin Candidate','e2e_run':run}},timeout=25)
          print('signup_http='+str(sr.status_code)); print('signup_body='+sr.text[:300]); sr.raise_for_status(); uid=sr.json()['id']
          link=None
          for _ in range(45):
              msgs=requests.get('https://api.mail.tm/messages',headers=mh,timeout=15).json().get('hydra:member',[])
              if msgs:
                  m=requests.get('https://api.mail.tm/messages/'+msgs[0]['id'],headers=mh,timeout=15).json()
                  h=m.get('html') or ''; h=h[0] if isinstance(h,list) and h else h
                  blob=html.unescape((h or '')+' '+(m.get('text') or ''))
                  for u in re.findall(r'https?://[^\s"<>]+',blob):
                      if '/auth/v1/verify' in u: link=u.replace('&amp;','&'); break
              if link: break
              time.sleep(2)
          assert link, 'confirmation link not found'
          first=requests.get(link,allow_redirects=False,timeout=30)
          print('verify_http='+str(first.status_code)); print('verify_location='+str(first.headers.get('location')))
          final=requests.get(link,allow_redirects=True,timeout=30)
          print('confirm_final='+final.url); print('confirm_final_http='+str(final.status_code))
          assert final.url.startswith(R), 'confirmation redirected somewhere else: '+final.url
          assert final.status_code==200
          lr=requests.post(S+'/auth/v1/token?grant_type=password',headers=H,json={'email':email,'password':P},timeout=25)
          print('login_http='+str(lr.status_code)); lr.raise_for_status(); token=lr.json()['access_token']
          uh={'apikey':K,'Authorization':'Bearer '+token}
          pr=requests.get(S+'/rest/v1/profiles',headers=uh,params={'id':'eq.'+uid,'select':'id,email,role,approved,display_name'},timeout=20)
          print('profile_http='+str(pr.status_code)); print('profile='+pr.text); pr.raise_for_status()
          rows=pr.json(); assert rows and rows[0]['role']=='pending' and rows[0]['approved'] is False
          print('ADMIN_CANDIDATE_ID='+uid)
          print('ADMIN_CANDIDATE_EMAIL='+email)
          print('PHASE_A_OK=true')
          PY
