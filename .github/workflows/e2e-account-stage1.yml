name: Speed Pathway Account E2E Stage 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-account-stage1.yml'
permissions:
  contents: read
  actions: write
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Create and confirm two public-site accounts
        run: |
          cat > /tmp/e2e.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const PUBLIC='https://taylorchell043-spec.github.io/speed-pathway/';
          const PASSWORD='SpeedPathwayE2E!2026';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(url,opts={}){
            const r=await fetch(url,opts);
            const text=await r.text();
            let body;try{body=JSON.parse(text)}catch{body=text}
            if(!r.ok)throw new Error(`${opts.method||'GET'} ${url} -> ${r.status}: ${text.slice(0,500)}`);
            return body;
          }
          async function mailbox(label){
            const domains=await api('https://api.mail.tm/domains?page=1');
            const domain=(domains['hydra:member']||[]).find(d=>d.isActive!==false)?.domain;
            if(!domain)throw new Error('No mail.tm domain available');
            const address=`speedpathway-${label}-${Date.now()}-${Math.random().toString(36).slice(2,7)}@${domain}`;
            await api('https://api.mail.tm/accounts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address,password:PASSWORD})});
            const tok=await api('https://api.mail.tm/token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address,password:PASSWORD})});
            return {address,token:tok.token};
          }
          async function confirmationLink(box){
            for(let i=0;i<45;i++){
              const m=await api('https://api.mail.tm/messages?page=1',{headers:{authorization:`Bearer ${box.token}`}});
              const msgs=m['hydra:member']||[];
              if(msgs.length){
                const full=await api(`https://api.mail.tm/messages/${msgs[0].id}`,{headers:{authorization:`Bearer ${box.token}`}});
                const src=[full.html,full.text,full.intro].flat().filter(Boolean).join('\n').replaceAll('&amp;','&');
                const matches=src.match(/https?:\/\/[^\s"'<>]+/g)||[];
                const link=matches.find(x=>x.includes('rcisvivlhpdwwikoakmt.supabase.co')&&x.includes('/auth/v1/verify'));
                if(link)return link.replace(/&quot;.*$/,'');
              }
              await sleep(2000);
            }
            throw new Error(`Confirmation email not received for ${box.address}`);
          }
          async function signupAndConfirm(page,label,name){
            const box=await mailbox(label);
            await page.goto(PUBLIC,{waitUntil:'networkidle'});
            await page.locator('#authShowSignup').click();
            await page.locator('#authName').fill(name);
            await page.locator('#authNewEmail').fill(box.address);
            await page.locator('#authNewPassword').fill(PASSWORD);
            await page.locator('#authCreate').click();
            await page.waitForFunction(()=>document.querySelector('#authSignupMsg')?.textContent?.includes('Account created'),null,{timeout:15000});
            const link=await confirmationLink(box);
            await page.goto(link,{waitUntil:'networkidle'});
            await sleep(1500);
            const finalUrl=page.url();
            if(!finalUrl.startsWith(PUBLIC))throw new Error(`Confirmation did not return to public site: ${finalUrl}`);
            if(/localhost|error/i.test(finalUrl))throw new Error(`Bad confirmation redirect: ${finalUrl}`);
            await page.locator('#pendingPanel').waitFor({state:'visible',timeout:15000});
            await page.locator('#pendingOut').click();
            await page.locator('#loginPanel').waitFor({state:'visible',timeout:10000});
            return {email:box.address,confirmationFinalUrl:finalUrl};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const admin=await signupAndConfirm(page,'admincandidate','E2E Admin Candidate');
            const pending=await signupAndConfirm(page,'pendinguser','E2E Pending User');
            const out={password:PASSWORD,adminEmail:admin.email,pendingEmail:pending.email,adminRedirect:admin.confirmationFinalUrl,pendingRedirect:pending.confirmationFinalUrl};
            fs.writeFileSync('e2e-stage1.json',JSON.stringify(out,null,2));
            console.log('STAGE1_RESULT='+JSON.stringify(out));
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/e2e.js
      - name: Upload stage1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-pathway-e2e-stage1
          path: e2e-stage1.json
          if-no-files-found: ignore
